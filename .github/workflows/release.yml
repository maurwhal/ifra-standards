name: Build Windows app

# Builds the double-click IFRA-Standards.exe.
#  - On a version tag (v0.1.0, v0.2.0, ...): builds it and creates a GitHub
#    Release with the .exe attached.
#  - Run by hand from the Actions tab: builds it and uploads it as a workflow
#    artifact you can download, without making a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install . pyinstaller

      - name: Build the .exe
        run: >
          pyinstaller --onefile --console
          --name IFRA-Standards
          --collect-submodules ifra_standards
          src/ifra_standards/app.py

      - name: Smoke-test the .exe (no network)
        run: dist\IFRA-Standards.exe --check
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: IFRA-Standards-windows
          path: dist/IFRA-Standards.exe

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/IFRA-Standards.exe
          --title "${{ github.ref_name }}"
          --notes "Double-click IFRA-Standards.exe to make the spreadsheet. See the README for the command-line version."
